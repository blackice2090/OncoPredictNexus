name: CI
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/research_predictor/frontend/package-lock.json
      - name: Install API dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify frozen inference and public privacy
        run: python -m unittest discover -s app/research_predictor/tests -t . -v
      - name: Install frontend dependencies
        run: npm run setup
      - name: Test frontend and private browser records
        run: npm test
      - name: Build frontend
        run: npm run build
